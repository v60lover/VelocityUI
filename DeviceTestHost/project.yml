name: DeviceTestHost

options:
  bundleIdPrefix: com.velocityui
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

packages:
  VelocityUI:
    path: ..
  # SPIKE VelocityUI-wmss.4.1: tree-sitter on device. The VelocityUITests target only
  # globs sources; it does NOT inherit the SPM test target's dependencies, so the two
  # tree-sitter packages must be declared here too. Remove with the spike.
  SwiftTreeSitter:
    url: https://github.com/tree-sitter/swift-tree-sitter
    from: "0.25.0"
  TreeSitterJSON:
    url: https://github.com/tree-sitter/tree-sitter-json
    from: "0.24.0"

targets:
  DeviceTestHost:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: VelocityUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velocityui.DeviceTestHost
        PRODUCT_NAME: "$(TARGET_NAME)"
        DEVELOPMENT_TEAM: KTSADV9433
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"

  # Hosts the SPM VelocityUITests bundle so it can run on a physical device.
  # Sources are globbed straight from the root package's Tests/VelocityUITests —
  # this is the whole point: adding/removing a test file there is picked up on
  # the next `xcodegen generate` with zero hand edits here.
  VelocityUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/VelocityUITests
      - path: ../BenchmarkHost/Sources/StreamDataset.swift
    dependencies:
      - target: DeviceTestHost
      - package: VelocityUI
      - package: SwiftTreeSitter
        product: SwiftTreeSitter
      - package: TreeSitterJSON
        product: TreeSitterJSON
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velocityui.VelocityUITests
        PRODUCT_NAME: "$(TARGET_NAME)"
        DEVELOPMENT_TEAM: KTSADV9433
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # XcodeGen auto-sets BUNDLE_LOADER for any test target depending on an
        # app target ("hosted test" pattern). The original hand-written project
        # deliberately omitted it: this bundle doesn't @testable import
        # DeviceTestHost, it runs as an independently-launched XCTest bundle
        # attached to the host app process (the mechanism that lets it run on a
        # physical device) — clear it back to empty to match.
        BUNDLE_LOADER: ""

schemes:
  VelocityUITests:
    build:
      targets:
        DeviceTestHost: all
        VelocityUITests: [test, analyze]
    test:
      config: Debug
      targets:
        - VelocityUITests
      testPlans:
        - path: VelocityUITests.xctestplan
          defaultPlan: true
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
