name: BenchmarkHost

options:
  bundleIdPrefix: com.velocityui
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    OTHER_CFLAGS:
      - $(inherited)
      - -Wno-parentheses
    OTHER_CPLUSPLUSFLAGS:
      - $(inherited)
      - -Wno-parentheses
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

packages:
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: 12.0.0
  Texture:
    path: Vendor/Texture
  VelocityUI:
    path: ..

targets:
  BenchmarkHost:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: Texture
        product: AsyncDisplayKit
      - package: VelocityUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velocityui.BenchmarkHost
        PRODUCT_NAME: "$(TARGET_NAME)"
        DEVELOPMENT_TEAM: KTSADV9433
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CADisableMinimumFrameDuration: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"

  BenchmarkHostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BenchmarkHost
      - package: Nuke
        product: Nuke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.velocityui.BenchmarkHostTests
        PRODUCT_NAME: "$(TARGET_NAME)"
        DEVELOPMENT_TEAM: KTSADV9433
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"

schemes:
  BenchmarkHost:
    build:
      targets:
        BenchmarkHost: all
    run:
      config: Release
      # Apple's Metal Performance HUD (GPU frametime + present rate) alongside the
      # custom LiveMetricsHUD. Scheme env vars apply only to manual Xcode launches;
      # the headless matrix launches via simctl/devicectl and never sees this, so
      # measured passes stay clean.
      environmentVariables:
        MTL_HUD_ENABLED: "1"
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  BenchmarkHostTests:
    build:
      targets:
        BenchmarkHostTests: [test, analyze]
    test:
      config: Debug
      targets:
        - BenchmarkHostTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
