			shellScript = "# Texture 3.0.3 ASTextLayout.mm has 4 chained comparisons (A < B < C) that\n# Clang 16 promotes to hard errors via -Wparentheses. Parenthesize them so\n# the warning fires at warning level, not error level.\nTEXTURE_MM=\"${BUILD_DIR%/Build/Products}/../SourcePackages/checkouts/Texture/Source/TextExperiment/Component/ASTextLayout.mm\"\nif [ -f \"$TEXTURE_MM\" ] && grep -q 'point\\.y) < fabs(right' \"$TEXTURE_MM\"; then\n  sed -i '' 's/= fabs(left - point\\.y) < fabs(right - point\\.y) < /= (fabs(left - point.y) < fabs(right - point.y)) < /g' \"$TEXTURE_MM\"\n  sed -i '' 's/= fabs(left - point\\.x) < fabs(right - point\\.x) < /= (fabs(left - point.x) < fabs(right - point.x)) < /g' \"$TEXTURE_MM\"\nfi\n";
